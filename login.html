<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SportStream — Login</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <a href="home.html" class="logo"><span class="bolt">&#9889;</span>SportStream</a>
    <nav>
      <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="live-streams.html" class="live-link"><span class="live-dot"></span>Live Streams</a>
        <a href="schedule.html">Schedule</a>
        <a href="pricing.html">Pricing</a>
        <button type="button" class="search-btn">Search<span class="search-dot"></span></button>
        <a href="feedback.html">Feedback</a>
        <a href="login.html" class="active">Login</a>
      </div>
    </nav>
  </header>

  <!-- LOGIN PAGE -->
  <main class="page">
    <div class="card">

      <!-- LEFT: Login Form -->
      <section class="form-panel">

        <h1 class="form-title">Login</h1>

        <div class="field">
          <label for="email">Email or Phone Number</label>
          <input type="text" id="email" name="email" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" />
        </div>

        <div class="form-row">
          <label class="remember-label">
            <input type="checkbox" name="remember" />
            Remember Me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="button" class="btn-login" onclick="handleLogin()">Login</button>

        <p class="signup-text">
          Don't have account? <a href="#" class="signup-link">Sign up</a>
        </p>

      </section>

      <!-- RIGHT: Promo Panel -->
      <section class="promo-panel">
        <img
          src="https://tse1.mm.bing.net/th/id/OIP.Px5GhrCM-t0ajVLjjrBvJAHaEK?w=1920&h=1080&rs=1&pid=ImgDetMain&o=7&rm=3"
          alt="Watch sports live"
          class="promo-img"
        />
        <h2 class="promo-title">Watch Your Favorite Sports Live</h2>
        <p class="promo-sub">Stream live games, check schedule and explore.</p>
        <a href="live-streams.html" class="btn-explore">Explore now</a>
      </section>

    </div>
  </main>

  <script>
    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('password').value;
      if (!email || !pass) {
        alert('Please enter your email and password.');
        return;
      }
      window.location.href = 'home.html';
    }
  </script>

</body>
</html>
